[project]
name = "ninjarmy"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "click",
    "pydantic",
    "pyyaml",
    "python-dotenv",
    "rich",
    "textual",
    "fastapi",
    "uvicorn[standard]",
    "websockets",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["ninjarmy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"

[project.scripts]
ninjarmy = "ninjarmy.cli.main:cli"